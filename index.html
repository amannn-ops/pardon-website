<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>For You 💖</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:linear-gradient(#10052a 0%,#3a1659 55%,#a2386f 100%);font-family:Georgia,'Palatino Linotype',serif;color:#fff;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#sky{position:fixed;inset:0;z-index:0}
.heart{position:fixed;bottom:-50px;pointer-events:none;z-index:1;animation:rise linear forwards}
@keyframes rise{to{transform:translateY(-115vh) translateX(var(--dx)) rotate(30deg);opacity:0}}

/* world */
#world{position:absolute;left:0;top:0;height:100%;width:3600px;z-index:2;will-change:transform}
.ground{position:absolute;left:0;right:0;bottom:0;height:90px;background:linear-gradient(#2a1050,#12062a);border-top:3px solid #ff9cc4;box-shadow:0 -10px 40px #ff5c9355}
.flower{position:absolute;bottom:88px;font-size:26px;animation:sway 3s ease-in-out infinite;transform-origin:bottom}
@keyframes sway{50%{transform:rotate(9deg)}}
.moon{position:absolute;top:8%;left:300px;font-size:90px;filter:drop-shadow(0 0 30px #ffe9a8)}
.wall{position:absolute;bottom:90px;width:230px;height:62%;border:3px solid #ffb3d1;border-radius:14px 14px 0 0;background:linear-gradient(#ffffff22,#ff5c9333);box-shadow:0 0 40px #ff5c9388,inset 0 0 30px #ffffff22;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;font-size:20px;line-height:1.3;overflow:hidden;transition:height 1.6s ease-in-out,opacity 1.6s;transform-origin:bottom}
.wall small{display:block;margin-top:10px;font-size:14px;opacity:.7;font-style:italic}
.wall.open{height:0;opacity:0;border-width:0}
.hint{position:absolute;bottom:200px;font-size:20px;opacity:.85;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px)}}

/* characters */
#player{position:absolute;bottom:88px;font-size:68px;line-height:1;z-index:5;filter:drop-shadow(0 0 14px #ff9cc4)}
#player span{display:inline-block}
#player.walk span{animation:step .35s ease-in-out infinite}
@keyframes step{50%{transform:translateY(-12px) rotate(-6deg)}}
#pet{position:absolute;bottom:88px;font-size:34px;z-index:4}
#boy{position:absolute;bottom:88px;font-size:68px;line-height:1;z-index:5;filter:drop-shadow(0 0 14px #8fd0ff);transition:transform 1.2s ease}
#boy.low{transform:translateY(10px) scale(1.08)}
#bubble{position:absolute;bottom:190px;width:270px;z-index:7;background:#fff;color:#4a1442;border-radius:18px;padding:12px 16px;font-size:18px;line-height:1.35;text-align:center;box-shadow:0 0 30px #ff5c93aa;opacity:0;transform:scale(.6);transition:all .35s cubic-bezier(.2,1.5,.4,1)}
#bubble.show{opacity:1;transform:scale(1)}
#bubble:after{content:'';position:absolute;bottom:-12px;left:50%;margin-left:-10px;border:10px solid transparent;border-top-color:#fff;border-bottom:0}

/* name tags */
.tag{position:absolute;left:50%;top:-16px;transform:translateX(-50%);font:700 14px Georgia,serif;background:#fffffff0;color:#4a1442;padding:2px 12px;border-radius:12px;white-space:nowrap;box-shadow:0 0 14px #ff5c93;line-height:1.4}
#names{position:fixed;top:38px;left:0;right:0;text-align:center;z-index:6;font-size:22px;font-style:italic;text-shadow:0 0 18px #ff5c93}

/* title / question / finale */
.overlay{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:24px;background:#10052acc;backdrop-filter:blur(4px)}
.overlay.hide{display:none}
h1{font-size:clamp(34px,7vw,64px);font-weight:400;font-style:italic;text-shadow:0 0 25px #ff5c93;margin-bottom:14px}
p.sub{font-size:clamp(16px,3vw,22px);max-width:520px;line-height:1.5;opacity:.9;margin-bottom:28px}
.btn{font:inherit;font-size:20px;padding:12px 30px;border-radius:40px;border:none;cursor:pointer;color:#fff;background:linear-gradient(135deg,#ff5c93,#ff8e5c);box-shadow:0 0 25px #ff5c93aa;transition:transform .2s}
.btn:hover{transform:scale(1.08)}
.card{background:linear-gradient(160deg,#2b0f4d,#4d1a63);border:2px solid #ffb3d1;border-radius:22px;padding:30px 26px 34px;width:min(92vw,480px);box-shadow:0 0 60px #ff5c9388;animation:pop .45s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.card h2{font-weight:400;font-size:clamp(22px,4.5vw,30px);margin-bottom:26px;line-height:1.3}
.answers{display:flex;gap:26px;justify-content:center;align-items:center;min-height:60px}
#noBtn{background:#6b5a85;box-shadow:none;transition:left .25s,top .25s}
#yesBtn{animation:beat 1.1s infinite}
@keyframes beat{50%{transform:scale(1.12)}}
#taunt{margin-top:18px;min-height:22px;font-size:15px;opacity:.85;font-style:italic}
#letter{max-width:560px;font-size:clamp(16px,2.8vw,21px);line-height:1.7;min-height:200px;white-space:pre-wrap;text-align:left;background:#ffffff14;border:1px solid #ffb3d155;border-radius:16px;padding:22px}

/* controls */
#pad{position:fixed;bottom:14px;left:0;right:0;z-index:6;display:flex;justify-content:space-between;padding:0 18px;pointer-events:none}
#pad button{pointer-events:auto;width:76px;height:76px;border-radius:50%;border:2px solid #ffb3d1;background:#ffffff1f;color:#fff;font-size:30px}
#guide{position:fixed;top:12px;left:0;right:0;text-align:center;z-index:6;font-size:15px;opacity:.8}
.burst{position:fixed;z-index:20;pointer-events:none;font-size:26px;animation:burst 1.3s ease-out forwards}
@keyframes burst{to{transform:translate(var(--x),var(--y)) scale(.4);opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style>
</head>
<body>
<canvas id="sky"></canvas>

<div id="guide">Walk with ← → (or A / D). Walk up to each glowing wall 💫</div>
<div id="names"></div>

<div id="world">
  <div class="moon">🌙</div>
  <div class="ground"></div>
  <div id="pet">🐾</div>
  <div id="player"><span>👸</span></div>
</div>

<div id="pad"><button id="bL">◀</button><button id="bR">▶</button></div>

<!-- start screen -->
<div class="overlay" id="start">
  <h1 id="hello">Hey you…</h1>
  <p class="sub">I made a little world just for you. It’s a short walk. There are a few things I need to say, and a few things I want to ask you.</p>
  <button class="btn" id="go">Enter 💌</button>
</div>

<!-- question -->
<div class="overlay hide" id="q">
  <div class="card">
    <h2 id="qText"></h2>
    <div class="answers"><button class="btn" id="yesBtn">Yes 💖</button><button class="btn" id="noBtn">No</button></div>
    <div id="taunt"></div>
  </div>
</div>

<!-- finale -->
<div class="overlay hide" id="end">
  <h1>For you, always 💖</h1>
  <div id="letter"></div>
  <p class="sub" style="margin-top:20px">— <span id="me"></span></p>
</div>

<script>
/* ================== CHANGE THESE ================== */
const HER_NAME = "Nikki";
const MY_NAME  = "Aman";

const QUESTIONS = [
  { text:"First, the truth: I know I made mistakes and I acted immature. Can you forgive me a little bit plssss? 🥺", wall:"Question 1<small>Walk to me…</small>",
    taunt:["Hmm? The No button is shy 😳","Nope, it ran away 🏃","Nice try 😜","It really doesn’t want to be pressed 🥹","Just press Yes, please? 💕"] },
  { text:"I’m learning to listen, to think before I act, and to grow up. Will you give me one more chance to prove it? 🌱", wall:"Question 2<small>Almost there…</small>",
    taunt:["Too slow! 😂","You can’t catch it 🙈","The No button got scared 🫣","Try Yes, it’s friendlier 💖","Nope, still escaping 🏃‍♂️"] },
  { text:"Last one: can I make you smile every single day from now on? 😊✨", wall:"Last question<small>I promise 💫</small>",
    taunt:["No is on vacation 🏝️","Wrong button 😝","Sorry, only Yes works here 💘","I believe in you… press Yes 😌","Hehe 😄"] }
];

const LETTER = `Dear ${HER_NAME},

I’m sorry. I know I was immature and I made mistakes that hurt you. I’m not going to give you excuses.

I’m going to change, little by little. I’ll listen more, think before I speak, and be someone you can count on.

You matter so much to me. Thank you for reading this, and I know you may not forgive me after so much I did, but please let me try this time. 💖

I promise to make you proud of me.`;
/* ================================================== */

document.getElementById('hello').textContent = "Hey " + HER_NAME + "…";
document.getElementById('me').textContent = MY_NAME;
document.getElementById('names').textContent = HER_NAME + " 💖 " + MY_NAME;
const herTag=document.createElement('div'); herTag.className='tag'; herTag.textContent=HER_NAME;
document.getElementById('player').appendChild(herTag);

/* ---------- starry sky ---------- */
const cv = document.getElementById('sky'), cx = cv.getContext('2d');
let stars = [], shoot = [];
function size(){ cv.width = innerWidth; cv.height = innerHeight;
  stars = Array.from({length:150},()=>({x:Math.random()*cv.width,y:Math.random()*cv.height*.85,r:Math.random()*1.8+.3,p:Math.random()*6.28,s:Math.random()*.04+.01})); }
addEventListener('resize',size); size();
function sky(){
  cx.clearRect(0,0,cv.width,cv.height);
  stars.forEach(s=>{ s.p+=s.s; cx.globalAlpha=.4+.6*Math.abs(Math.sin(s.p)); cx.fillStyle='#fff'; cx.beginPath(); cx.arc(s.x,s.y,s.r,0,6.28); cx.fill(); });
  if(Math.random()<.008) shoot.push({x:Math.random()*cv.width,y:Math.random()*cv.height*.4,l:0});
  shoot = shoot.filter(s=>s.l<40);
  shoot.forEach(s=>{ s.l++; s.x-=9; s.y+=4; cx.globalAlpha=1-s.l/40; cx.strokeStyle='#ffe9a8'; cx.lineWidth=2; cx.beginPath(); cx.moveTo(s.x,s.y); cx.lineTo(s.x+40,s.y-18); cx.stroke(); });
  requestAnimationFrame(sky);
}
sky();

/* ---------- floating hearts ---------- */
const HEARTS = ['💖','💗','💕','💘','✨','🌸','⭐'];
function floatHeart(){
  const h = document.createElement('div'); h.className='heart';
  h.textContent = HEARTS[Math.random()*HEARTS.length|0];
  h.style.left = Math.random()*100+'vw';
  h.style.fontSize = (14+Math.random()*26)+'px';
  h.style.animationDuration = (7+Math.random()*7)+'s';
  h.style.setProperty('--dx',(Math.random()*160-80)+'px');
  document.body.appendChild(h); setTimeout(()=>h.remove(),15000);
}
setInterval(floatHeart,550);

function burst(x,y,n=26){
  for(let i=0;i<n;i++){
    const b=document.createElement('div'); b.className='burst';
    b.textContent=HEARTS[Math.random()*HEARTS.length|0];
    b.style.left=x+'px'; b.style.top=y+'px';
    const a=Math.random()*6.28, d=80+Math.random()*180;
    b.style.setProperty('--x',Math.cos(a)*d+'px'); b.style.setProperty('--y',Math.sin(a)*d+'px');
    document.body.appendChild(b); setTimeout(()=>b.remove(),1400);
  }
}

/* ---------- world ---------- */
const world=document.getElementById('world'), player=document.getElementById('player'), pet=document.getElementById('pet');
const WORLD_W=3600, WALL_X=[900,1700,2500], END_X=3250;
for(let i=0;i<70;i++){ const f=document.createElement('div'); f.className='flower'; f.textContent=['🌸','🌷','🌼','🌹'][i%4]; f.style.left=(i*52+Math.random()*30)+'px'; f.style.animationDelay=(Math.random()*3)+'s'; world.appendChild(f); }
const walls = QUESTIONS.map((q,i)=>{ const w=document.createElement('div'); w.className='wall'; w.style.left=WALL_X[i]+'px'; w.innerHTML=q.wall; world.appendChild(w); return w; });
const hint=document.createElement('div'); hint.className='hint'; hint.style.left='170px'; hint.textContent='Walk this way ➜'; world.appendChild(hint);
const boy=document.createElement('div'); boy.id='boy'; boy.style.left=END_X+'px'; boy.textContent='🧑'; world.appendChild(boy);
const boyTag=document.createElement('div'); boyTag.className='tag'; boyTag.textContent=MY_NAME;
boyTag.style.left=(END_X+34)+'px'; boyTag.style.top='auto'; boyTag.style.bottom='162px'; world.appendChild(boyTag);
const bubble=document.createElement('div'); bubble.id='bubble'; bubble.style.left=(END_X-100)+'px'; world.appendChild(bubble);

const SCENE=[
 ["Hey… 🥺",0],
 [HER_NAME+", I’m really sorry.",0],
 ["I was immature, and I hurt you. I know that now.",0],
 ["So I’m going down on the ground in front of you. Please forgive me. 🙇",1],
 ["I promise I will change. I will make you proud. 💖",1]
];
function scene(){
  state='scene'; keys={}; face=1; let i=0;
  (function next(){
    if(i>=SCENE.length){ bubble.classList.remove('show'); setTimeout(finale,700); return; }
    const [t,low]=SCENE[i++];
    bubble.classList.remove('show');
    setTimeout(()=>{
      bubble.textContent=t; bubble.classList.add('show');
      if(low && boy.textContent!=='🙇'){ boy.textContent='🙇'; boy.classList.add('low'); const r=boy.getBoundingClientRect(); burst(r.left+r.width/2,r.top+r.height/2,22); }
      setTimeout(next,2900);
    },350);
  })();
}

let px=80, face=1, keys={}, state='title', cur=0, opened=0, asked=-1, finished=false, last=performance.now();
addEventListener('keydown',e=>{ keys[e.key.toLowerCase()]=true; });
addEventListener('keyup',e=>{ keys[e.key.toLowerCase()]=false; });
function hold(id,k){ const b=document.getElementById(id);
  b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true;});
  ['pointerup','pointerleave','pointercancel'].forEach(t=>b.addEventListener(t,()=>keys[k]=false)); }
hold('bL','arrowleft'); hold('bR','arrowright');

function loop(t){
  const dt=Math.min(40,t-last); last=t;
  let dir=0;
  if(state==='walk'){ if(keys['arrowright']||keys['d']) dir=1; if(keys['arrowleft']||keys['a']) dir=-1; }
  if(dir){ face=dir; px+=dir*dt*.32; }
  const limit = opened<WALL_X.length ? WALL_X[opened]-70 : END_X-170;
  px=Math.max(20,Math.min(px,limit));
  player.classList.toggle('walk',!!dir);
  player.style.left=px+'px';
  player.firstChild.style.transform=`scaleX(${face})`;
  pet.style.left=(px-face*60)+'px';
  const cam=Math.max(0,Math.min(px-innerWidth/2,WORLD_W-innerWidth));
  world.style.transform=`translateX(${-cam}px)`;
  hint.style.opacity = px>260?0:.85;
  if(state==='walk'){
    if(opened<WALL_X.length && asked<opened && px>=limit-30){ asked=opened; ask(opened); }
    if(opened>=WALL_X.length && px>=END_X-175 && !finished){ finished=true; scene(); }
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ---------- start ---------- */
document.getElementById('go').onclick=()=>{ document.getElementById('start').classList.add('hide'); state='walk'; };

/* ---------- questions ---------- */
const qBox=document.getElementById('q'), yes=document.getElementById('yesBtn'), no=document.getElementById('noBtn'), taunt=document.getElementById('taunt');
let dodges=0;
function ask(i){
  state='ask'; cur=i; dodges=0; keys={};
  document.getElementById('qText').textContent=QUESTIONS[i].text;
  taunt.textContent='';
  no.style.position='static'; no.style.left=no.style.top='';
  qBox.classList.remove('hide');
}
function dodge(e){
  if(e){ e.preventDefault(); e.stopPropagation(); }
  dodges++;
  no.style.position='fixed';
  const w=no.offsetWidth, h=no.offsetHeight;
  const yr=yes.getBoundingClientRect();
  let x,y,tries=0;
  do{ x=Math.random()*(innerWidth-w-20)+10; y=Math.random()*(innerHeight-h-20)+10; tries++;
  }while(tries<40 && x<yr.right+40 && x+w>yr.left-40 && y<yr.bottom+40 && y+h>yr.top-40);
  no.style.left=x+'px'; no.style.top=y+'px';
  const arr=QUESTIONS[cur].taunt; taunt.textContent=arr[(dodges-1)%arr.length];
  yes.style.transform='scale('+Math.min(1+dodges*.06,1.5)+')';
}
['mouseenter','pointerdown','touchstart','click','focus'].forEach(ev=>no.addEventListener(ev,dodge,{passive:false}));
yes.addEventListener('click',e=>{
  const r=yes.getBoundingClientRect(); burst(r.left+r.width/2,r.top+r.height/2,36);
  qBox.classList.add('hide'); yes.style.transform='';
  walls[cur].classList.add('open'); opened=cur+1; state='walk';
});

/* ---------- finale ---------- */
function finale(){
  state='end'; keys={}; document.getElementById('end').classList.remove('hide');
  const el=document.getElementById('letter'); let i=0;
  (function type(){ el.textContent=LETTER.slice(0,i++); if(i<=LETTER.length) setTimeout(type,38); })();
  setInterval(()=>burst(Math.random()*innerWidth,Math.random()*innerHeight*.7,18),900);
}
</script>
</body>
</html>
